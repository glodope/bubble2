    <title>BUBBLE</title>
    <style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:none; user-select:none; -webkit-user-select:none; }
html,body { width:100%; height:100%; overflow:hidden; background:#0a0a1a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#fff; touch-action:none; }

}
#game-container { position:fixed; top:0; left:0; width:100%; height:100%; overflow:hidden; }

#ui-layer .screen { position:fixed; top:0; left:0; width:100%; height:100%; display:none; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; padding:max(8px, var(--safe-top)) max(8px, env(safe-area-inset-right,0px)) max(8px, var(--safe-bottom)) max(8px, env(safe-area-inset-left,0px)); }
#ui-layer .screen.active { display:flex; pointer-events:auto; }
.menu-glass { background:rgba(15,15,35,0.88); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.08); border-radius:var(--btn-radius); padding:var(--glass-pad) clamp(16px, 4.5vmin, 32px); width:min(90%, 380px); text-align:center; box-shadow:0 12px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06); animation:glassIn 0.5s cubic-bezier(0.22,1,0.36,1); }
@keyframes glassIn { from{opacity:0;transform:translateY(30px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }
.game-title { font-size:var(--title-size); font-weight:900; letter-spacing:clamp(3px, 1.2vmin, 6px); background:linear-gradient(135deg,#ffd700,#ff8c00,#ff4500); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:clamp(4px, 1.5vmin, 8px); filter:drop-shadow(0 2px 8px rgba(255,140,0,0.3)); }
.game-subtitle { font-size:clamp(11px, 3vmin, 15px); color:rgba(255,255,255,0.45); letter-spacing:clamp(4px, 1.8vmin, 8px); margin-bottom:clamp(16px, 6vmin, 32px); text-transform:uppercase; }
.menu-bubble-demo { width:clamp(60px, 18vmin, 100px); height:clamp(60px, 18vmin, 100px); margin:0 auto clamp(14px, 5vmin, 32px); border-radius:50%; background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.9),rgba(100,200,255,0.4),rgba(50,100,200,0.2)); box-shadow:0 0 24px rgba(100,200,255,0.25),inset 0 0 24px rgba(255,255,255,0.15); animation:bubbleFloat 3s ease-in-out infinite; position:relative; }
.menu-bubble-demo::after { content:''; position:absolute; top:18%; left:22%; width:22%; height:22%; border-radius:50%; background:rgba(255,255,255,0.8); filter:blur(1px); }
@keyframes bubbleFloat { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-14px) scale(1.05)} }
.best-score { margin-top:22px; font-size:14px; color:rgba(255,255,255,0.45); letter-spacing:1px; }
.best-score span { color:#ffd700; font-weight:700; font-size:20px; }
.btn { display:block; width:100%; padding:var(--btn-pad) clamp(12px, 3vmin, 20px); margin:clamp(5px, 1.5vmin, 10px) 0; border:none; border-radius:var(--btn-radius); font-size:clamp(13px, 3.8vmin, 18px); font-weight:700; letter-spacing:clamp(1px, 0.5vmin, 3px); cursor:pointer; transition:all 0.15s ease; pointer-events:auto; position:relative; overflow:hidden; min-height:44px; }
.btn:active { transform:scale(0.96); }
.btn-primary { background:linear-gradient(135deg,#ff8c00,#ff4500); color:#fff; box-shadow:0 4px 18px rgba(255,69,0,0.3); }
.btn-secondary { background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.8); border:1px solid rgba(255,255,255,0.12); }
.btn-back { background:transparent; color:rgba(255,255,255,0.45); font-size:14px; margin-top:16px; }
#hud { justify-content:space-between; align-items:center; padding:max(12px, var(--safe-top)) 0 0; pointer-events:none !important; }
#hud * { pointer-events:none !important; }
.hud-center { position:absolute; top:max(12px, var(--safe-top)); left:50%; transform:translateX(-50%); text-align:center; }
.score-label { display:block; font-size:9px; letter-spacing:4px; color:rgba(255,255,255,0.3); margin-bottom:2px; }
.score-value { font-size:var(--score-size); font-weight:900; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,0.6); line-height:1; }
.hud-bottom { position:absolute; bottom:0; left:0; width:100%; padding:0 0 max(0px, var(--safe-bottom)) 0; }
.progress-bar { width:100%; height:clamp(2px, 0.6vmin, 4px); background:rgba(255,255,255,0.06); border-radius:0; overflow:hidden; }
.progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#ff8c00,#ffd700); border-radius:0; transition:width 0.3s ease; }
#btn-pause { position:absolute; top:max(12px, var(--safe-top)); right:16px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; pointer-events:auto !important; z-index:10; }
#btn-pause:active { transform:scale(0.9); background:rgba(255,255,255,0.15); }
.bonus-bar { position:absolute; top:max(12px, var(--safe-top)); left:16px; display:flex; gap:8px; pointer-events:none; z-index:10; }
.bonus-icon { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); position:relative; backdrop-filter:blur(4px); }
.bonus-icon.flash { animation:bonusFlash 0.5s ease infinite alternate; }
@keyframes bonusFlash { from{opacity:1;transform:scale(1)} to{opacity:0.5;transform:scale(1.1)} }
.bonus-timer { position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); font-size:9px; color:#fff; background:rgba(0,0,0,0.6); padding:1px 5px; border-radius:4px; white-space:nowrap; font-weight:700; }
.dead-title { font-size:34px; font-weight:900; color:#ff4500; letter-spacing:4px; margin-bottom:16px; animation:shake 0.5s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
.dead-bubble { width:60px; height:60px; margin:0 auto 20px; border-radius:50%; background:radial-gradient(circle,rgba(255,100,100,0.3),transparent); border:2px solid rgba(255,100,100,0.5); position:relative; animation:popDead 0.6s ease; }
@keyframes popDead { 0%{transform:scale(1);opacity:1} 50%{transform:scale(1.4);opacity:0.5} 100%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
.final-stats { display:flex; justify-content:space-around; margin:20px 0; padding:16px; background:rgba(0,0,0,0.2); border-radius:16px; }
.stat { text-align:center; }
.stat-label { display:block; font-size:10px; color:rgba(255,255,255,0.4); letter-spacing:2px; margin-bottom:4px; }
.stat-value { font-size:24px; font-weight:900; color:#fff; }
.levels-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:16px; }
.level-card { aspect-ratio:1.8; border-radius:var(--btn-radius); background:rgba(255,255,255,0.04); border:2px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s ease; position:relative; pointer-events:auto; }
.level-card.completed { border-color:#4caf50; background:rgba(76,175,80,0.08); }
.level-card.locked { opacity:0.35; pointer-events:none; }
.level-card:active { transform:scale(0.95); }
.level-num { font-size:22px; font-weight:900; color:#fff; }
.level-stars { font-size:14px; color:#ffd700; margin-top:4px; }
.level-hearts { font-size:12px; color:#ff4444; margin-top:2px; }
.shop-tabs { display:flex; gap:8px; margin-bottom:16px; justify-content:center; }
.shop-tab { padding:8px 16px; border-radius:20px; border:none; background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.5); font-size:13px; font-weight:700; cursor:pointer; transition:all 0.2s; pointer-events:auto; }
.shop-tab.active { background:linear-gradient(135deg,#ff8c00,#ff4500); color:#fff; }
.skins-glass { max-height:min(82vh, calc(100vh - var(--safe-top) - var(--safe-bottom) - 40px)); overflow-y:auto; padding:clamp(16px, 4vmin, 28px) clamp(12px, 3.5vmin, 20px); }
.screen-title { font-size:24px; font-weight:900; letter-spacing:3px; margin-bottom:8px; }
.coins-display { font-size:18px; color:#ffd700; margin-bottom:16px; font-weight:700; }
.skins-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(8px, 2.5vmin, 14px); margin-bottom:clamp(10px, 3vmin, 18px); }
.skin-card { aspect-ratio:1; border-radius:var(--btn-radius); background:rgba(255,255,255,0.04); border:2px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s ease; position:relative; padding:clamp(4px, 1.5vmin, 10px); pointer-events:auto; min-height:70px; }
.skin-card.active { border-color:#ff8c00; background:rgba(255,140,0,0.08); }
.skin-card.locked { opacity:0.35; }
.skin-card.affordable { opacity:1; border-color:rgba(255,215,0,0.4); box-shadow:0 0 12px rgba(255,215,0,0.1); }
.skin-card:active { transform:scale(0.95); }
.skin-preview { width:52px; height:52px; border-radius:50%; position:relative; margin-bottom:4px; }
.skin-preview::after { content:''; position:absolute; top:15%; left:18%; width:22%; height:22%; border-radius:50%; background:rgba(255,255,255,0.7); filter:blur(0.5px); }
.skin-name { font-size:10px; color:rgba(255,255,255,0.65); text-align:center; }
.skin-price { font-size:10px; color:#ffd700; margin-top:2px; }
.skin-check { position:absolute; top:4px; right:4px; width:18px; height:18px; background:#ff8c00; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; }
.rarity-badge { position:absolute; top:4px; left:4px; width:8px; height:8px; border-radius:50%; }
.rarity-common { background:#a0a0a0; }
.rarity-uncommon { background:#4caf50; }
.rarity-rare { background:#2196f3; }
.rarity-epic { background:#9c27b0; }
.rarity-legendary { background:#ff9800; box-shadow:0 0 6px #ff9800; }
.trail-preview { width:52px; height:52px; border-radius:50%; position:relative; margin-bottom:4px; overflow:hidden; background:rgba(0,0,0,0.2); }
.case-container { position:relative; width:100%; height:120px; overflow:hidden; margin:20px 0; background:rgba(0,0,0,0.2); border-radius:12px; border:1px solid rgba(255,255,255,0.08); }
.case-strip { display:flex; gap:12px; position:absolute; top:50%; transform:translateY(-50%); transition:none; }
.case-item { width:80px; height:80px; border-radius:12px; background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.1); display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; }
.case-selector { position:absolute; top:0; left:50%; transform:translateX(-50%); width:4px; height:100%; background:linear-gradient(180deg,transparent,#ffd700,transparent); z-index:2; }
.case-glow { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:84px; height:84px; border-radius:12px; box-shadow:0 0 20px rgba(255,215,0,0.3); pointer-events:none; }
.setting-row { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:16px; color:rgba(255,255,255,0.8); }
.toggle-btn { padding:6px 16px; border-radius:20px; border:none; background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.45); font-size:12px; font-weight:700; cursor:pointer; transition:all 0.2s; pointer-events:auto; }
.toggle-btn.active { background:linear-gradient(135deg,#ff8c00,#ff4500); color:#fff; }
.lang-selector { display:flex; gap:8px; }
.lang-btn { padding:6px 14px; border-radius:20px; border:none; background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.5); font-size:12px; font-weight:700; cursor:pointer; pointer-events:auto; }
.lang-btn.active { background:rgba(255,255,255,0.2); color:#fff; }
.coin-icon { display:inline-block; width:clamp(12px, 3.8vmin, 18px); height:clamp(12px, 3.8vmin, 18px); border-radius:50%; background:radial-gradient(circle at 30% 30%, #fff8c8, #ffd700, #daa520); border:clamp(1px, 0.35vmin, 1.5px) solid #b8860b; box-shadow:0 0 3px rgba(255,215,0,0.4); vertical-align:middle; margin-right:3px; position:relative; top:-1px; }
.coin-icon::after { content:'$'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:9px; font-weight:900; color:rgba(140,100,0,0.7); }
.coin-small { width:10px !important; height:10px !important; vertical-align:middle !important; margin-right:2px !important; border-width:1px !important; top:-1px !important; position:relative !important; }
.coin-small::after { font-size:6px !important; transform:translate(-50%,-50%) !important; }
.skins-glass::-webkit-scrollbar{display:none} .skins-glass{-ms-overflow-style:none;scrollbar-width:none; touch-action:pan-y !important;}
.levels-grid{touch-action:pan-y !important;}

.shop-scroll { max-height:min(45vh, 300px); overflow-y:auto !important; touch-action:pan-y !important; -ms-overflow-style:none; scrollbar-width:none; margin-bottom:10px; border-radius:var(--btn-radius); background:rgba(0,0,0,0.15); padding:10px; -webkit-overflow-scrolling:touch; min-height:120px; }
.shop-scroll::-webkit-scrollbar { display:none; }
#shop-content { width:100%; }
.shop-actions { display:flex; gap:8px; margin-top:8px; }
.shop-actions .btn { margin:0; min-height:44px; }
.shop-actions .btn:disabled { opacity:0.4; cursor:not-allowed; }
.skin-card { position:relative; pointer-events:auto; cursor:pointer; transition:all 0.2s ease; }
.skin-card .skin-preview-wrap { width:100%; aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; margin-bottom:4px; }
.skin-card .skin-preview-wrap .skin-shell { width:90%; height:90%; border-radius:50%; position:relative; }
.skin-card .skin-preview-wrap .skin-shell::after { content:''; position:absolute; top:15%; left:18%; width:22%; height:22%; border-radius:50%; background:rgba(255,255,255,0.7); filter:blur(0.5px); }
.skin-card .skin-name { font-size:9px; color:rgba(255,255,255,0.65); text-align:center; line-height:1.2; }
.skin-card .skin-price { font-size:9px; color:#ffd700; margin-top:2px; text-align:center; }
.skin-card.active { border-color:#ff8c00; background:rgba(255,140,0,0.08); }
.skin-card.locked { opacity:0.45; }
.skin-card.affordable { opacity:1; border-color:rgba(255,215,0,0.4); box-shadow:0 0 12px rgba(255,215,0,0.1); }
.trail-preview-wrap { width:100%; aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; margin-bottom:4px; background:rgba(0,0,0,0.2); overflow:hidden; }
.case-box { width:100%; height:150px; border-radius:18px; background:linear-gradient(145deg, rgba(40,30,10,0.6), rgba(20,15,5,0.8)); border:2px solid rgba(180,140,40,0.5); display:flex; flex-direction:column; align-items:center; justify-content:center; margin-bottom:14px; position:relative; overflow:hidden; box-shadow:inset 0 1px 0 rgba(255,215,0,0.1), 0 8px 24px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,215,0,0.08); }

.case-strip-modern { display:flex; gap:16px; position:absolute; top:50%; transform:translateY(-50%); transition:none; }

.case-selector-modern { position:absolute; top:0; left:50%; transform:translateX(-50%); width:3px; height:100%; background:linear-gradient(180deg,transparent,rgba(255,215,0,0.8),transparent); z-index:2; box-shadow:0 0 8px rgba(255,215,0,0.4); }

@media (max-height:600px) { .game-title{font-size:clamp(26px, 8vmin, 34px)} .menu-glass{padding:16px 12px} .btn{padding:10px;margin:5px 0;font-size:13px} .menu-bubble-demo{width:55px;height:55px;margin-bottom:12px} .score-value{font-size:clamp(28px, 9vmin, 40px)} .skin-card{padding:4px} .levels-grid{grid-template-columns:repeat(3,1fr)} }

<body>
    <div id="game-container">
        <canvas id="game-canvas" tabindex="0"></canvas>
        <div id="ui-layer">
            <div id="main-menu" class="screen active">
                <div class="menu-glass">
                    <h1 class="game-title" data-i18n="title">BUBBLE</h1>
                    <p class="game-subtitle" data-i18n="subtitle">Не лопни.</p>
                    <div class="menu-bubble-demo" id="menu-bubble"></div>
                    <button class="btn btn-primary" id="btn-play" data-i18n="play">ИГРАТЬ</button>
                    <button class="btn btn-secondary" id="btn-levels" data-i18n="levels">УРОВНИ</button>
                    <button class="btn btn-secondary" id="btn-shop" data-i18n="shop">МАГАЗИН</button>
                    <button class="btn btn-secondary" id="btn-settings" data-i18n="settings">НАСТРОЙКИ</button>
                    <div class="best-score"><span data-i18n="best">Рекорд</span>: <span id="menu-best">0</span></div>
                </div>
            </div>
            <div id="hud" class="screen">
                <div class="bonus-bar" id="bonus-bar"></div>
                <div class="hud-center">
                    <span class="score-label" data-i18n="height">ВЫСОТА</span>

// ==================== GAME CLASSES ====================
class Coin {
    constructor(x, y) {
        this.x = x; this.y = y; this.radius = 13;
        this.collected = false; this.scale = 1; this.alpha = 1;
        this.floatPhase = Math.random() * Math.PI * 2;
        this.sparklePhase = Math.random() * Math.PI * 2;
    }
    update(dt) {
        this.floatPhase += dt * 2.5;
        this.sparklePhase += dt * 4;
        this.y += Math.sin(this.floatPhase) * 4 * dt;
        if (this.collected) { this.scale += dt * 5; this.alpha -= dt * 4; }
    }
    render(ctx) {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);
        ctx.globalAlpha = this.alpha;
        const r = this.radius;
        ctx.beginPath(); ctx.arc(1, 2, r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.fill();
        const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
        g.addColorStop(0, '#fff8c8'); g.addColorStop(0.35, '#ffd700'); g.addColorStop(0.75, '#daa520'); g.addColorStop(1, '#b8860b');
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
        ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 1.0;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,220,0.35)'; ctx.lineWidth = 0.7;
        ctx.beginPath(); ctx.arc(0, 0, r * 0.82, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(140,100,0,0.55)'; ctx.font = 'bold ' + Math.floor(r * 1.2) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('$', 0, r * 0.05);
        ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.35, r * 0.22, r * 0.11, -0.55, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.65)'; ctx.fill();
        if (Math.sin(this.sparklePhase) > 0.75) {
            ctx.beginPath(); ctx.arc(r * 0.45, -r * 0.45, 1.8, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
        }
        ctx.restore();
    }
    checkCollision(bubble) {
        const dx = bubble.x - this.x, dy = bubble.y - this.y;
        return Math.sqrt(dx * dx + dy * dy) < this.radius + bubble.radius * 0.85;
    }
}

class Obstacle {
    constructor(x, y) { this.x = x; this.y = y; this.rotation = 0; this.rotSpeed = (Math.random() - 0.5) * 2; }
    update(dt) { this.rotation += this.rotSpeed * dt; }
    render(ctx) { }
    checkCollision(bubble) { return false; }
    getObsColor(type, fallback) {
        const skin = Game.currentSkinObj;
        return skin && skin.obstacles[type] ? skin.obstacles[type] : fallback;
    }
}

class IceCube extends Obstacle {
    constructor(x, y) {
        super(x, y); this.size = 28 + Math.random() * 14; this.rotSpeed = (Math.random() - 0.5) * 0.6;
        this.floatPhase = Math.random() * Math.PI * 2; this.bubbles = [];
        for (let i = 0; i < 3; i++) this.bubbles.push({ bx: (Math.random() - 0.5) * 0.7, by: (Math.random() - 0.5) * 0.7, br: 0.05 + Math.random() * 0.12 });
    }
    update(dt) { super.update(dt); this.floatPhase += dt * 1.4; this.y += Math.sin(this.floatPhase) * 5 * dt; }
    render(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
        const s = this.size, h = s / 2;
        const baseColor = this.getObsColor('ice', '#c8e6f5');
        ctx.fillStyle = 'rgba(80,130,180,0.12)'; ctx.fillRect(-h - 2, -h - 2 + s * 0.08, s + 4, s + 4);
        const backGrad = ctx.createLinearGradient(-h * 0.3, -h * 0.3, h * 0.8, h * 0.8);
        backGrad.addColorStop(0, 'rgba(200,235,255,0.55)'); backGrad.addColorStop(0.5, 'rgba(170,215,245,0.42)'); backGrad.addColorStop(1, 'rgba(140,195,230,0.30)');
        ctx.fillStyle = backGrad; ctx.fillRect(-h, -h, s, s);
        ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.0; ctx.strokeRect(-h, -h, s, s);
        const depth = ctx.createRadialGradient(-h * 0.25, -h * 0.25, s * 0.1, 0, 0, h * 0.9);
        depth.addColorStop(0, 'rgba(255,255,255,0.25)'); depth.addColorStop(0.4, 'rgba(210,240,255,0.12)'); depth.addColorStop(1, 'rgba(120,180,220,0.08)');
        ctx.fillStyle = depth; ctx.fillRect(-h + 2, -h + 2, s - 4, s - 4);
        this.bubbles.forEach(b => {
            const bx = b.bx * s * 0.7, by = b.by * s * 0.7, br = b.br * s;
            ctx.beginPath(); ctx.arc(bx + 1, by + 1, br, 0, Math.PI * 2); ctx.fillStyle = 'rgba(100,160,200,0.15)'; ctx.fill();
            ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 0.5; ctx.stroke();
            ctx.beginPath(); ctx.arc(bx - br * 0.3, by - br * 0.3, br * 0.35, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
        });
        const topShine = ctx.createLinearGradient(-h, -h, -h, -h + s * 0.45);
        topShine.addColorStop(0, 'rgba(255,255,255,0.55)'); topShine.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = topShine; ctx.fillRect(-h + 3, -h + 2, s - 6, s * 0.35);
        const sideShine = ctx.createLinearGradient(-h, -h, -h + s * 0.25, -h);
        sideShine.addColorStop(0, 'rgba(255,255,255,0.40)'); sideShine.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = sideShine; ctx.fillRect(-h + 2, -h + 3, s * 0.22, s - 6);
        const bottomShadow = ctx.createLinearGradient(0, h - s * 0.3, 0, h);
        bottomShadow.addColorStop(0, 'rgba(80,140,190,0)'); bottomShadow.addColorStop(1, 'rgba(80,140,190,0.18)');
        ctx.fillStyle = bottomShadow; ctx.fillRect(-h + 2, h - s * 0.3, s - 4, s * 0.3);
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 0.6; ctx.strokeRect(-h + 1.5, -h + 1.5, s - 3, s - 3);
        ctx.restore();
    }
    checkCollision(bubble) {
        const s = this.size / 2, c = Math.cos(-this.rotation), si = Math.sin(-this.rotation);
        const dx = bubble.x - this.x, dy = bubble.y - this.y;
        const lx = dx * c - dy * si, ly = dx * si + dy * c;
        const cx = Math.max(-s, Math.min(s, lx)), cy = Math.max(-s, Math.min(s, ly));
        return (lx - cx) * (lx - cx) + (ly - cy) * (ly - cy) < bubble.radius * bubble.radius;
    }
}

        }
        if (this.slowRecoverTimer > 0 && !this.slowActive) { this.slowRecoverTimer -= dt; if (this.slowRecoverTimer < 0) this.slowRecoverTimer = 0; }

        const glass = Game.glass;
        const slowMult = this.slowActive ? 0.5 : (this.slowRecoverTimer > 0 ? 0.5 + 0.5 * (1 - this.slowRecoverTimer / 3) : 1);

class Camera {

}

const Game = {
    canvas: null, ctx: null, width: 0, height: 0, dpr: 1,
    state: 'menu', lastTime: 0, accumulator: 0, tickRate: 1 / 60,
    bubble: null, glass: null, camera: null, world: null,
    score: 0, bestScore: 0, coins: 0,
    settings: { sound: true, vibration: true, particles: true },
    currentSkin: 'water', currentTrail: 'default',
    gameMode: 'endless', currentLevel: 0, levelProgress: [], collectedHearts: 0,
    paused: false, speedMult: 1, showedHeartMessage: false,
    floatingTexts: [], heartBlockTimer: 0,

    init() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.resize();
        const self = this;
        window.addEventListener('resize', function() { self.resize(); });
        window.addEventListener('orientationchange', function() { setTimeout(function() { self.resize(); }, 150); });
        this.loadSave();
        this.glass = new Glass();
        this.bubble = new Bubble();
        this.camera = new Camera();
        this.world = new World();
        this.setupInput();
        this.lastTime = performance.now();
        requestAnimationFrame(function(t) { self.loop(t); });
    },

    resize() {
        const c = document.getElementById('game-container');
        this.width = c.clientWidth; this.height = c.clientHeight;
        this.canvas.width = this.width * this.dpr;
        this.canvas.height = this.height * this.dpr;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        if (this.glass) this.glass.resize();
        if (this.bubble) this.bubble.resize();
    },

    setupInput() {
        const c = this.canvas;
        const getSide = function(e) {
            const touch = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : (e.touches && e.touches[0] ? e.touches[0] : null);
            const cx = touch ? touch.clientX : e.clientX;
            return cx < window.innerWidth / 2 ? 'left' : 'right';
        };
        const self = this;
        const down = function(e) {
            if (self.state !== 'playing' || self.paused) return;
            if (e.type === 'touchstart') e.preventDefault();
            if (e.target && e.target.closest && e.target.closest('#btn-pause')) return;
            if (self.bubble) self.bubble.clickSide(getSide(e));
        };
        c.addEventListener('mousedown', down);
        c.addEventListener('touchstart', down, { passive: false });
        c.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    },

    start(mode, levelIndex) {
        this.gameMode = mode || 'endless';
        this.currentLevel = levelIndex || 0;
        this.state = 'playing'; this.score = 0; this.paused = false;
        this.speedMult = 1; this.showedHeartMessage = false;
        this.collectedHearts = 0; this.heartBlockTimer = 0;
        this.bubble.reset(); this.camera.reset();
        this.world.reset();
        if (this.gameMode === 'level') {
            this.world.loadLevel(this.currentLevel);
        }
        this.updateHUD(); this.updateBonusBar();
        document.getElementById('game-canvas').style.filter = 'none';
    },

    pause() {
        if (this.state !== 'playing') return;
        this.paused = true;
        showScreen('pause-screen');
    },

    resume() {
        if (!this.paused) return;
        this.paused = false;
        showScreen('hud');
        this.speedMult = 0.1;
        const self = this;
        const recover = function() {
            if (self.state !== 'playing' || self.paused) return;
            self.speedMult += 0.03;
            if (self.speedMult < 1) requestAnimationFrame(recover);
            else self.speedMult = 1;
        };
        recover();
    },

    gameOver() {
        this.state = 'gameover';
        if (this.settings.vibration && navigator.vibrate) navigator.vibrate([50, 30, 80]);
        if (this.score > this.bestScore) this.bestScore = this.score;
        if (this.gameMode === 'endless') this.coins += Math.floor(this.score / 10);
        this.save();
        if (this.world) this.world.createDeathExplosion(this.bubble.x, this.bubble.y, this.bubble.radius);
        if (AudioEngine.ctx) AudioEngine.play('pop');
        const self = this;
        setTimeout(function() {
            document.getElementById('final-score').textContent = Math.floor(self.score);
            document.getElementById('final-best').textContent = self.bestScore;
            showScreen('game-over');
            document.getElementById('game-canvas').style.filter = 'blur(8px) brightness(0.45)';
        }, 400);
    },

    levelComplete() {
        this.state = 'levelcomplete';
        if (!this.levelProgress[this.currentLevel]) this.levelProgress[this.currentLevel] = { completed: true, stars: 1 };
        else this.levelProgress[this.currentLevel].completed = true;
        const lvl = LEVELS_DATA[this.currentLevel];
        const hearts = this.collectedHearts;
        const required = (lvl.hearts || []).length;
        let stars = 1;
        if (required > 0) { if (hearts >= required) stars = 3; else if (hearts >= required * 0.5) stars = 2; }
        else stars = 3;
        this.levelProgress[this.currentLevel].stars = Math.max(this.levelProgress[this.currentLevel].stars || 0, stars);
        this.coins += 10 + this.currentLevel * 5;
        this.save();
        document.getElementById('complete-level').textContent = this.currentLevel + 1;
        document.getElementById('complete-coins').textContent = 10 + this.currentLevel * 5;
        showScreen('level-complete');
        document.getElementById('game-canvas').style.filter = 'blur(8px) brightness(0.45)';
    },

    loop(ts) {
        if (this.lastTime === 0) this.lastTime = ts;
        const dt = Math.min((ts - this.lastTime) / 1000, 0.05);
        this.lastTime = ts;
        this.accumulator += dt;
        while (this.accumulator >= this.tickRate) { this.update(this.tickRate); this.accumulator -= this.tickRate; }
        this.render();
        const self = this;
        requestAnimationFrame(function(t) { self.loop(t); });
    },

    update(dt) {
        if (this.state === 'playing' && !this.paused) {
            this.bubble.update(dt);
            this.camera.update(dt, this.bubble.y);
            if (this.world) this.world.update(dt, this.bubble, this.camera.y);
            const ns = Math.max(0, Math.floor(-this.bubble.y / 100));
            if (ns > this.score) { this.score = ns; this.updateHUD(); }
            if (this.bubble.dead && this.state === 'playing') this.gameOver();
            this.updateFloatingTexts(dt);
            this.updateBonusBar();
        } else if (this.state === 'gameover' && this.world) {
            this.world.updateParticlesOnly(dt);
        }
    },

    render() {
        const ctx = this.ctx, w = this.width, h = this.height;
        ctx.clearRect(0, 0, w, h);
        this.drawBackground(ctx, w, h);
        ctx.save(); ctx.translate(0, -this.camera.y);
        this.glass.renderBack(ctx, this.camera.y);
        if (this.world) this.world.renderObstacles(ctx, this.camera.y);
        this.bubble.render(ctx);
        if (this.world) this.world.renderParticles(ctx, this.camera.y);
        this.glass.renderFront(ctx, this.camera.y);
        ctx.restore();
        this.drawVignette(ctx, w, h);
        this.renderFloatingTexts(ctx);
    },

    drawBackground(ctx, w, h) {
        const time = Date.now() * 0.0003;
        const hueShift = Math.sin(time) * 8;
        const theme = SkinManager.getTheme();
        const g = ctx.createLinearGradient(0, 0, 0, h);
        theme.stops.forEach(function(stop, i) { g.addColorStop(i / (theme.stops.length - 1), 'hsl(' + (stop.h + hueShift) + ', ' + stop.s + '%, ' + stop.l + '%)'); });
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 5; i++) {
            const ph = time * 0.5 + i * 1.2;
            const x = w * (0.15 + 0.7 * ((Math.sin(ph * 0.7) + 1) / 2));
            const a = 0.012 + Math.sin(ph) * 0.006;
            const rg = ctx.createLinearGradient(x - 30, 0, x + 30, 0);
            rg.addColorStop(0, 'rgba(' + theme.ray[0] + ',' + theme.ray[1] + ',' + theme.ray[2] + ',0)');
            rg.addColorStop(0.5, 'rgba(' + theme.ray[0] + ',' + theme.ray[1] + ',' + theme.ray[2] + ',' + a + ')');
            rg.addColorStop(1, 'rgba(' + theme.ray[0] + ',' + theme.ray[1] + ',' + theme.ray[2] + ',0)');
            ctx.fillStyle = rg; ctx.fillRect(x - 30, 0, 60, h);
        }
        for (let i = 0; i < 3; i++) {
            const y = (time * 25 + i * h / 3) % (h + 100) - 50;
            ctx.fillStyle = 'rgba(' + theme.wave[0] + ',' + theme.wave[1] + ',' + theme.wave[2] + ',' + (0.015 + Math.sin(time + i) * 0.008) + ')';
            ctx.beginPath(); ctx.moveTo(0, y);
            for (let x = 0; x <= w; x += 20) ctx.lineTo(x, y + Math.sin(x * 0.008 + time + i) * 12);
            ctx.lineTo(w, y + 35); ctx.lineTo(0, y + 35); ctx.closePath(); ctx.fill();
        }
    },

    drawVignette(ctx, w, h) {
        const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, h * 0.85);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    },

    updateHUD() {
        document.getElementById('hud-score').textContent = this.score;
        document.getElementById('menu-best').textContent = this.bestScore;
        document.getElementById('shop-coins').textContent = this.coins;
        const progress = this.gameMode === 'level' && LEVELS_DATA[this.currentLevel] ? Math.min((-this.bubble.y) / LEVELS_DATA[this.currentLevel].length * 100, 100) : Math.min((this.score % 50) / 50 * 100, 100);
        document.getElementById('progress-fill').style.width = progress + '%';
    },

    updateBonusBar() {
        const bar = document.getElementById('bonus-bar');
        if (!this.bubble || !bar) return;
        const b = this.bubble;
        let html = '';
        const svgShield = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2L3 5v4c0 4.5 2.5 7.5 6 8 3.5-.5 6-3.5 6-8V5L9 2z" stroke="white" stroke-width="1.5" fill="rgba(255,255,255,0.15)"/><path d="M9 2v13" stroke="white" stroke-width="1" opacity="0.4"/></svg>';
        const svgSlow = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="6.5" stroke="white" stroke-width="1.5" fill="rgba(255,255,255,0.15)"/><path d="M9 5v4.5l3 1.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>';
        const svgCoin = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="white" stroke-width="1.5" fill="rgba(255,255,255,0.15)"/><text x="9" y="13" text-anchor="middle" fill="white" font-size="10" font-weight="bold">×2</text></svg>';
        const svgMini = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M5 4v3H2M13 4v3h3M5 14v-3H2M13 14v-3h3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        const bonuses = [
            { active: b.shieldActive, timer: b.shieldTimer, icon: svgShield, flash: b.shieldFlash },
            { active: b.slowActive, timer: b.slowTimer, icon: svgSlow, flash: false },
            { active: b.coin2xActive, timer: b.coin2xTimer, icon: svgCoin, flash: false },
            { active: b.miniActive, timer: b.miniTimer, icon: svgMini, flash: b.miniFlash }
        ];
        bonuses.forEach(function(bn) {
            if (bn.active) html += '<div class="bonus-icon' + (bn.flash ? ' flash' : '') + '">' + bn.icon + '<span class="bonus-timer">' + Math.ceil(bn.timer) + '</span></div>';
        });
        if (bar.innerHTML !== html) bar.innerHTML = html;
    },

    showFloatingText(text, x, y) { this.floatingTexts.push({ text: text, x: x, y: y, life: 2, alpha: 1 }); },
    updateFloatingTexts(dt) { this.floatingTexts.forEach(function(t) { t.life -= dt; t.y -= 30 * dt; t.alpha = Math.min(1, t.life); }); this.floatingTexts = this.floatingTexts.filter(function(t) { return t.life > 0; }); },
    renderFloatingTexts(ctx) { this.floatingTexts.forEach(function(t) { ctx.save(); ctx.globalAlpha = t.alpha; ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 8; ctx.fillText(t.text, t.x, t.y); ctx.restore(); }); },

    loadSave() {
        try {
            const s = JSON.parse(localStorage.getItem('bubble_save_v2') || '{}');
            this.bestScore = s.best || 0; this.coins = s.coins || 0;
            this.currentSkin = s.skin || 'water';
            this.currentTrail = s.trail || 'default';
            this.settings = Object.assign({}, this.settings, s.settings || {});
            this.levelProgress = s.levels || [];
            currentLang = s.lang || 'ru';
        } catch (e) {}
    },

    save() {
        localStorage.setItem('bubble_save_v2', JSON.stringify({
            best: this.bestScore, coins: this.coins, skin: this.currentSkin, trail: this.currentTrail,
            settings: this.settings, levels: this.levelProgress, lang: currentLang, version: 2
        }));
    },

    get currentSkinObj() { return SKINS_DATA.find(function(s) { return s.id === Game.currentSkin; }) || SKINS_DATA[0]; }
};

function showScreen(name) {
    document.querySelectorAll('#ui-layer .screen').forEach(function(s) { s.classList.remove('active'); });
    const t = document.getElementById(name);
    if (t) t.classList.add('active');
    const canvas = document.getElementById('game-canvas');
    if (name === 'main-menu' || name === 'shop-screen' || name === 'settings-screen' || name === 'levels-screen') {
        canvas.style.filter = 'blur(10px) brightness(0.55)';
    } else if (name === 'hud') {
        canvas.style.filter = 'none';
    } else if (name === 'game-over' || name === 'level-complete' || name === 'pause-screen') {
        canvas.style.filter = 'blur(6px) brightness(0.45)';
    }
}
function hideAllScreens() { document.querySelectorAll('#ui-layer .screen').forEach(function(s) { s.classList.remove('active'); }); }

function renderLevels() {
    const grid = document.getElementById('levels-grid'); grid.innerHTML = '';
    LEVELS_DATA.forEach(function(lvl, i) {
        const progress = Game.levelProgress[i] || {};
        const completed = progress.completed || false;
        const stars = progress.stars || 0;
        const prevCompleted = i === 0 || (Game.levelProgress[i-1] && Game.levelProgress[i-1].completed);
        const card = document.createElement('div');
        card.className = 'level-card' + (completed ? ' completed' : '') + (!prevCompleted ? ' locked' : '');
        card.innerHTML = '<div class="level-num">' + (i + 1) + '</div>' + (completed ? '<div class="level-stars">' + '★'.repeat(stars) + '☆'.repeat(3 - stars) + '</div>' : '') + (lvl.hearts ? '<div class="level-hearts">♥ ' + lvl.hearts.length + '</div>' : '');
        card.addEventListener('click', function() {
            if (!prevCompleted) return;
            if (AudioEngine.ctx) AudioEngine.play('release');
            hideAllScreens(); showScreen('hud'); Game.start('level', i);
        });
        grid.appendChild(card);
    });
}

document.addEventListener('DOMContentLoaded', function() {
    AudioEngine.init();
    SkinManager.init();
    Game.init();
    updateLanguage(currentLang);
    showScreen('main-menu');
    Game.updateHUD();
    SkinManager.updateMenuBubble();

    document.getElementById('btn-play').addEventListener('click', function() {
        if (AudioEngine.ctx) AudioEngine.play('release');
        hideAllScreens(); showScreen('hud'); Game.start('endless');
    });
    document.getElementById('btn-levels').addEventListener('click', function() {
        if (AudioEngine.ctx) AudioEngine.play('stick');
        renderLevels(); showScreen('levels-screen');
    });
    document.getElementById('btn-shop').addEventListener('click', function() {
        if (AudioEngine.ctx) AudioEngine.play('stick');
        document.querySelectorAll('.shop-tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelector('.shop-tab[data-tab="skins"]').classList.add('active');
        SkinManager.renderShop('skins');
        showScreen('shop-screen');
    });
    document.getElementById('btn-settings').addEventListener('click', function() {
        if (AudioEngine.ctx) AudioEngine.play('stick');
        updateSettingsUI(); showScreen('settings-screen');
    });
    document.getElementById('btn-restart').addEventListener('click', function() {
        if (AudioEngine.ctx) AudioEngine.play('release');
        hideAllScreens(); showScreen('hud'); Game.start(Game.gameMode, Game.currentLevel);
    });
    document.getElementById('btn-menu').addEventListener('click', function() {
        if (AudioEngine.ctx) AudioEngine.play('stick');
        showScreen('main-menu'); Game.updateHUD(); SkinManager.updateMenuBubble();
    });
    document.getElementById('btn-levels-back').addEventListener('click', function() {
        if (AudioEngine.ctx) AudioEngine.play('stick');
        showScreen('main-menu');
    });
    document.getElementById('btn-shop-back').addEventListener('click', function() {
        if (AudioEngine.ctx) AudioEngine.play('stick');
        showScreen('main-menu');
    });
    document.getElementById('btn-settings-back').addEventListener('click', function() {
        if (AudioEngine.ctx) AudioEngine.play('stick');
        Game.save(); showScreen('main-menu');
    });
    document.getElementById('btn-pause').addEventListener('click', function() { Game.pause(); });
    document.getElementById('btn-resume').addEventListener('click', function() { Game.resume(); });
    document.getElementById('btn-pause-restart').addEventListener('click', function() {
        Game.paused = false;
        hideAllScreens(); showScreen('hud'); Game.start(Game.gameMode, Game.currentLevel);
    });
    document.getElementById('btn-pause-menu').addEventListener('click', function() {
        Game.paused = false;
        Game.state = 'menu';
        showScreen('main-menu'); Game.updateHUD(); SkinManager.updateMenuBubble();
    });
    document.getElementById('btn-next-level').addEventListener('click', function() {
        if (AudioEngine.ctx) AudioEngine.play('release');
        const next = Game.currentLevel + 1;
        if (next < LEVELS_DATA.length) { hideAllScreens(); showScreen('hud'); Game.start('level', next); }
        else showScreen('main-menu');
    });
    document.getElementById('btn-complete-menu').addEventListener('click', function() {
        if (AudioEngine.ctx) AudioEngine.play('stick');
        showScreen('main-menu'); Game.updateHUD(); SkinManager.updateMenuBubble();
    });
    document.querySelectorAll('.shop-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.shop-tab').forEach(function(t) { t.classList.remove('active'); });
            tab.classList.add('active');
            SkinManager.renderShop(tab.getAttribute('data-tab'));
        });
    });
    document.getElementById('toggle-sound').addEventListener('click', function() {
        Game.settings.sound = !Game.settings.sound; this.classList.toggle('active'); this.textContent = Game.settings.sound ? 'ON' : 'OFF';
        if (Game.settings.sound && AudioEngine.ctx) AudioEngine.play('release');
    });
    document.getElementById('toggle-vibro').addEventListener('click', function() {
        Game.settings.vibration = !Game.settings.vibration; this.classList.toggle('active'); this.textContent = Game.settings.vibration ? 'ON' : 'OFF';
    });
    document.getElementById('toggle-particles').addEventListener('click', function() {
        Game.settings.particles = !Game.settings.particles; this.classList.toggle('active'); this.textContent = Game.settings.particles ? 'ON' : 'OFF';
    });
    document.querySelectorAll('.lang-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            updateLanguage(btn.getAttribute('data-lang'));
            Game.save();
        });
    });

    function updateSettingsUI() {
        const s = Game.settings;
        const ut = function(id, v) { const b = document.getElementById(id); b.classList.toggle('active', v); b.textContent = v ? 'ON' : 'OFF'; };
        ut('toggle-sound', s.sound); ut('toggle-vibro', s.vibration); ut('toggle-particles', s.particles);
        document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-lang') === currentLang); });
    }

    document.addEventListener('keydown', function(e) {
        if (Game.state !== 'playing' || !Game.bubble || Game.paused) return;
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowLeft' || e.code === 'KeyA') Game.bubble.clickSide('left');
        else if (e.code === 'ArrowRight' || e.code === 'KeyD') Game.bubble.clickSide('right');
        else if (e.code === 'Escape') Game.pause();
    });
    document.addEventListener('touchmove', function(e) { if (Game.state === 'playing') e.preventDefault(); }, { passive: false });
    document.addEventListener('touchstart', function(e) {
        if (Game.state === 'playing' && Game.bubble && e.changedTouches && e.changedTouches[0] && !Game.paused) {
            if (e.target && e.target.closest && e.target.closest('#btn-pause')) return;
            const cx = e.changedTouches[0].clientX;
            Game.bubble.clickSide(cx < window.innerWidth / 2 ? 'left' : 'right');
        }
    }, { passive: false });
});
</script>
</body>
